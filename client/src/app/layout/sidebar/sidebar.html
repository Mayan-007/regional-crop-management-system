<mat-nav-list>
  @for (item of menuItems; track item.route) {
    @if (!item.roles || item.roles.includes(role()!)) {
      <a mat-list-item [routerLink]="item.route">
        <mat-icon matListItemIcon>
          {{ item.icon }}
        </mat-icon>

        <span matListItemTitle>
          {{ item.label }}
        </span>
      </a>
    }
  }
</mat-nav-list>
