services:
    postgres:
        image: postgres:16

        container_name: agri_postgres

        restart: always

        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: agri_management

        ports:
            - "5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
